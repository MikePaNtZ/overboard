[workspace]
resolver = "2"
members = [
    "crates/board-types",
    "crates/hal",
    "crates/hal-actuate",
    "crates/vesc-wire",
    "crates/vesc-tx",
    "crates/control-core",
    "crates/safety",
    "crates/sim-backend",
    "crates/control-ffi",
    "crates/board-app-ridden",
    "crates/board-app-driverless",
    "crates/canary-ridden",
    "crates/can-harness",
    "crates/plant-mujoco",
    "crates/sim-host",
    "crates/loop-profiler",
    "crates/platform-contract",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
board-types = { path = "crates/board-types" }
hal = { path = "crates/hal" }
hal-actuate = { path = "crates/hal-actuate" }
vesc-wire = { path = "crates/vesc-wire" }
vesc-tx = { path = "crates/vesc-tx" }
control-core = { path = "crates/control-core" }
safety = { path = "crates/safety" }
sim-backend = { path = "crates/sim-backend" }
plant-mujoco = { path = "crates/plant-mujoco" }
serde = { version = "1", default-features = false, features = ["derive"] }
socketcan = "3.6"
libc = "0.2"
