name: CI

on:
  # Feature-branch pushes are covered by `pull_request`. Without the branch
  # filter both events fire on every PR commit and the whole suite runs twice.
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A newer push supersedes an in-flight run on the same ref. Mainline is exempt:
# its runs publish the sim artifact, and cancelling one halfway could leave the
# rolling release pointing at a partially-uploaded set.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # ---------------------------------------------------------------------
  # Does this change need a ~20 min render? Docs-only commits cannot change
  # sim behaviour, and on a doc-heavy project they were burning a full render
  # each to publish a preview identical to the last one.
  #
  # A job, not a workflow-level `paths-ignore`: that would skip `rust` and
  # `sim` too, and a SKIPPED required check never reports, so branch
  # protection would wait on it forever. Only the render is optional.
  #
  # Compares against the PREVIOUS HEAD (`github.event.before`), not the PR
  # base. Diffing against the base means the comparison covers every commit on
  # the branch, so on a long-lived feature PR -- exactly the case this exists
  # for -- one earlier code commit makes every later docs commit look like a
  # code change and the skip never fires. `before` is populated on both `push`
  # and `pull_request: synchronize`; it is absent when a PR is first opened,
  # where the base is the correct comparison anyway.
  #
  # Fails OPEN -- if the comparison commit cannot be resolved (first push on a
  # branch, force-push, shallow history) it renders. Rendering needlessly
  # costs minutes; skipping wrongly loses the artifact for that commit.
  # ---------------------------------------------------------------------
  render-needed:
    runs-on: ubuntu-latest
    outputs:
      render: ${{ steps.check.outputs.render }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "comparison base '$BASE' unresolvable - rendering to be safe"
            echo "render=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "comparing ${BASE:0:7}..${HEAD:0:7}"
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "changed files:"; echo "$changed"

          # Anything that is not a doc or a markdown file means render.
          if echo "$changed" | grep -qvE '^(docs/|\.github/ISSUE_|.*\.md$)'; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only change - skipping the render"
            echo "render=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # crates/plant-mujoco (issue #91) links libmujoco out of the pip
      # 'mujoco' wheel -- MUJOCO_DIR is unset here, so its build.rs falls
      # back to the wheel probe, which needs `python3 -c 'import mujoco'` to
      # succeed. Installed from the SAME pin as requirements-sim.txt (not
      # duplicated by hand) so the version this job links can never drift
      # from the one `sim` tests against.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install MuJoCo (plant-mujoco's native dependency)
        run: pip install "$(grep '^mujoco==' requirements-sim.txt)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt --check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace

      # ICD §6.3 / DR-MODE-1: board-app-ridden must have zero motion
      # authority, proven by the dependency graph rather than asserted by a
      # reviewer. canary-ridden is the positive control -- the gate has to
      # actually flag it, or the check itself has silently stopped working
      # (issue #1).
      - name: crate-exclusion boundary gate
        run: cargo run -p xtask -- gate

  # ---------------------------------------------------------------------
  # Sim-in-the-loop gate. Physics only -- no GL, no rendering, ~2 seconds.
  # Runs on every push and PR, and its failure fails the build.
  # ---------------------------------------------------------------------
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-sim.txt

      - name: Install sim toolchain
        run: pip install -r requirements-sim.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The closed-loop gate loads the REAL control law over the C ABI, so the
      # cdylib has to exist before pytest runs. If it is missing those tests
      # FAIL rather than skip -- a closed-loop test that passes because the
      # controller was absent would be worse than no test at all.
      - name: Build the control library
        run: cargo build --release -p control-ffi

      # I1b (issue #106): tests/test_rust_python_plant_replay_equivalence.py shells out to this
      # binary to compare the Rust-hosted plant against the Python-hosted one
      # it runs in-process. Same "fail rather than skip" rule as above.
      - name: Build the plant-mujoco replay binary
        run: cargo build --release -p plant-mujoco --bin plant-replay

      # I1c (issue #107, AC6): tests/test_rust_hosted_impulse_response.py
      # shells out to this binary to compare the Rust-hosted closed loop
      # (hal + sim-backend's real plant) against the Python-hosted one. Same
      # "fail rather than skip" rule as above.
      - name: Build the Rust-hosted impulse-response binary
        run: cargo build --release -p board-app-driverless --bin impulse-response-rust

      - name: Scenario acceptance gate
        run: pytest tests/ -v

  # ---------------------------------------------------------------------
  # The `policy` job MOVED to .github/workflows/policy.yml (#87).
  #
  # Not deleted -- relocated, so the job's owner owns its file. This file is
  # Senior Controls' by CODEOWNERS; the policy gate is the COO's by ADR-0003,
  # and every COO change to it was tripping a turf failure that needed an
  # override. A routine override is a check that has stopped meaning anything.
  #
  # The job kept its NAME. `policy` is a required status check and branch
  # protection matches by job name, not by workflow file, so protection is
  # unaffected. Renaming it would hang every PR forever.
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # Film the scenario and publish it, always behind a green gate -- the landing
  # page eventually consumes this artifact, so a clip must never be published
  # for a commit whose physics did not pass.
  #
  # ONE job renders for both destinations, deliberately. Only the publish step
  # differs by ref:
  #   master  -> rolling `sim-latest` release, stable URLs, feeds the web page.
  #   PR      -> accumulating `sim-preview` prerelease, sha-stamped filenames,
  #              giving one immutable URL per commit to paste into the Notion
  #              implementation log as a feature develops.
  # A second job would have been simpler to read and would have drifted from
  # this one within a release or two; then the clip Mike reviews on a PR would
  # no longer be from the same pipeline as the clip that ships.
  #
  # Still deliberately NOT a required status check: it now reports on PRs, but
  # rendering depends on an offscreen GL stack and must not be able to block a
  # merge whose physics passed.
  # ---------------------------------------------------------------------
  publish-sim-artifact:
    needs: [sim, rust, render-needed]
    # Fork PRs get a read-only token, so the upload would fail on a
    # contribution rather than on a mistake. Render-and-skip-publish is not
    # worth the minutes; skip the job outright.
    if: >-
      needs.render-needed.outputs.render == 'true' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write        # rolling release upload
    env:
      # On `pull_request`, `github.sha` is the EPHEMERAL MERGE COMMIT, which
      # exists in no branch and cannot be checked out. Stamping artifacts with
      # it makes them untraceable -- the opposite of the point. Every consumer
      # of a sha in this job wants the head commit, so resolve it once here.
      ARTIFACT_SHA: >-
        ${{ github.event_name == 'pull_request'
            && github.event.pull_request.head.sha
            || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-sim.txt

      - name: Install sim toolchain
        run: pip install -r requirements-sim.txt

      # MuJoCo's offscreen renderer needs a GL implementation. osmesa is
      # software rasterisation: no GPU, no display, no driver roulette -- the
      # slow-but-certain option, which is the right trade for a build step.
      - name: Install OSMesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6 libgl1 libglx-mesa0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # --compare films the SAME disturbance closed-loop as a second pane, and
      # that pane runs the real control law over the C ABI -- so the cdylib has
      # to exist. The script has no fallback here on purpose: publishing an
      # "open vs closed" clip whose closed pane was quietly uncontrolled would
      # be a lie in the most visible artifact the project produces.
      - name: Build the control library
        run: cargo build --release -p control-ffi

      # Only tests that PASS contribute a claim (docs/design-claims-manifest.md,
      # issue #61). A red run here still writes a manifest of whatever passed,
      # but the step itself fails loudly -- this job already needs `sim` green,
      # so a failure here means the suite is non-deterministic, not that a
      # single claim quietly went missing.
      - name: Emit claims manifest
        run: python scripts/emit_claims.py

      - name: Render impulse scenario
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python scripts/render_scenario.py --compare

      # Fail loudly if rendering silently degraded to the plot-only fallback.
      # The script exits 0 in that case by design (a dead GL stack must not
      # fail the physics), so the publishing job has to check for itself.
      - name: Verify the video was actually produced
        run: |
          test -s sim/out/impulse_open_loop.mp4 || {
            echo "::error::no mp4 was rendered - offscreen GL likely failed"; exit 1; }
          test -s sim/out/impulse_poster.jpg
          test -s sim/out/impulse_metrics.json
          test -s sim/out/impulse_compare.mp4 || {
            echo "::error::no comparison clip - the closed-loop render failed"; exit 1; }
          # The comparison is only worth publishing if the two panes actually
          # differ. Equal outcomes would mean the controller did nothing and
          # the clip is quietly claiming a result it does not have.
          python - <<'PYCL'
          import json, pathlib
          cl = json.loads(pathlib.Path("sim/out/impulse_closed_loop_metrics.json").read_text())["metrics"]
          assert not cl["nose_strike"], "closed-loop pane struck; do not publish this as a recovery"
          assert cl["peak_abs_pitch_deg"] < 5.0, f"closed peak {cl['peak_abs_pitch_deg']:.2f} deg is not a recovery"
          print(f"closed loop: peak |pitch| {cl['peak_abs_pitch_deg']:.2f}deg, no strike")
          PYCL
          python - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("sim/out/impulse_metrics.json").read_text())["metrics"]
          assert m["nose_strike"], "published clip must show the documented outcome"
          print(f"strike {m['t_strike_s']:.3f}s  peak |pitch| {m['peak_abs_pitch_deg']:.2f}deg")
          PY

      # The rolling-terrain ride, and the truth-vs-estimate pair at 10%. That
      # pair is the more valuable artifact: it shows a limitation the project
      # is actively working on rather than a clean success, and terrain.py was
      # built specifically because it is the one scenario that can be filmed --
      # a gravity-rotated hill is invisible in a render.
      #
      # Its own step rather than folded into the impulse one, so a terrain
      # failure is attributable on sight and cannot take the impulse clip --
      # which the public README embeds -- down with it.
      - name: Render rolling-terrain ride
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python scripts/render_scenario.py --scenario terrain --compare --source sim

      - name: Verify the terrain clips were actually produced
        run: |
          test -s sim/out/terrain_ride.mp4 || {
            echo "::error::no terrain mp4 - offscreen GL likely failed"; exit 1; }
          test -s sim/out/terrain_poster.jpg
          test -s sim/out/terrain_metrics.json
          test -s sim/out/terrain_render_manifest.json
          test -s sim/out/terrain_compare.mp4 || {
            echo "::error::no terrain comparison clip"; exit 1; }
          # The comparison is only worth publishing if the two panes reach
          # different outcomes. Equal outcomes mean the attitude source made no
          # difference, and the clip would be captioned with a result it does
          # not have.
          python - <<'PYT'
          import json, pathlib
          def metrics(name):
              return json.loads(pathlib.Path(f"sim/out/{name}.json").read_text())["metrics"]
          truth, est = metrics("terrain_truth_metrics"), metrics("terrain_estimate_metrics")
          assert truth["reached_next_crest"], "truth pitch did not complete the ride"
          assert not est["reached_next_crest"] and est["nose_strike"], (
              "the estimate completed the ride too, so this is not the comparison "
              "it is captioned as -- re-derive the envelope with Senior Controls")
          print(f"truth: crest at {truth['t_reached_crest_s']:.2f}s   "
                f"estimate: {est['struck_end']} down at {est['t_strike_s']:.2f}s")
          # The manifest is what makes "this came from that run" checkable, so
          # a manifest that names no commit is a manifest that proves nothing.
          man = json.loads(pathlib.Path("sim/out/terrain_render_manifest.json").read_text())
          assert man["source"]["commit"], "render manifest carries no source commit"
          assert man["category"] and man["source_tag"], "render manifest is uncategorised"
          print(f"manifest: {man['category']} / {man['source_tag']} from "
                f"{man['source']['commit_short']}")
          PYT

      - name: Record provenance for downstream consumers
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("sim/out/impulse_metrics.json")
          doc = json.loads(p.read_text())
          m = doc["metrics"]
          # Flat, stable shape for the landing-page caption. Deliberately
          # separate from metrics.json so page copy never has to reach into
          # the scenario's internal schema.
          pathlib.Path("sim/out/sim-run.json").write_text(json.dumps({
              "schema": 1,
              "commit": os.environ["ARTIFACT_SHA"][:7],
              "commit_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/commit/{os.environ['ARTIFACT_SHA']}",
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "scenario": "impulse disturbance response",
              "regime": "open-loop (no controller)",
              "impulse_ns": doc["params"]["magnitude_ns"],
              "nose_strike_angle_deg": round(m["nose_strike_angle_deg"], 2),
              "peak_abs_pitch_deg": round(m["peak_abs_pitch_deg"], 2),
              "t_strike_s": round(m["t_strike_s"], 3) if m["t_strike_s"] else None,
              "speed_at_strike_ms": round(m["speed_at_strike_ms"], 2) if m["speed_at_strike_ms"] else None,
              "travel_m": round(m["travel_m"], 2),
              "mujoco_version": m["mujoco_version"],
          }, indent=2) + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          # Scenario-neutral: later increments of the closed-loop epic add
          # test-stand scenarios to the same sim/out/ directory.
          name: sim-artifacts-${{ env.ARTIFACT_SHA }}
          path: sim/out/
          retention-days: 30

      # Rolling release = one stable URL the landing page can pull from at
      # deploy time, so no binary ever lands in the web repo's git history.
      #   .../releases/download/sim-latest/impulse_open_loop.mp4
      - name: Publish to rolling sim-latest release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upsert rather than delete-then-create: deleting first leaves a
          # window where the download URL 404s, and that URL is exactly what a
          # deploy might be fetching at the time.
          gh release view sim-latest >/dev/null 2>&1 || \
            gh release create sim-latest \
              --title "Latest sim artifacts (mainline)" \
              --notes "Auto-published by CI. Sim Replay: impulse disturbance response (open loop) and the rolling-terrain ride."
          gh release edit sim-latest \
            --notes "Auto-published by CI from ${{ github.sha }}. Sim Replay: impulse disturbance response (open loop) and the rolling-terrain ride, truth pitch against the attitude estimate. Provenance for each is in its *_render_manifest.json."
          gh release upload sim-latest --clobber \
            sim/out/impulse_open_loop.mp4 \
            sim/out/impulse_open_loop.webm \
            sim/out/impulse_open_loop.gif \
            sim/out/impulse_compare.mp4 \
            sim/out/impulse_poster.jpg \
            sim/out/impulse_pitch.png \
            sim/out/impulse_metrics.json \
            sim/out/impulse_closed_loop_metrics.json \
            sim/out/impulse_render_manifest.json \
            sim/out/terrain_ride.mp4 \
            sim/out/terrain_ride.webm \
            sim/out/terrain_compare.mp4 \
            sim/out/terrain_poster.jpg \
            sim/out/terrain_ride.png \
            sim/out/terrain_compare.png \
            sim/out/terrain_metrics.json \
            sim/out/terrain_truth_metrics.json \
            sim/out/terrain_estimate_metrics.json \
            sim/out/terrain_render_manifest.json \
            sim/out/sim-run.json \
            sim/out/claims.json

      # Per-commit preview. Filenames are sha-stamped and the release is never
      # clobbered wholesale, so every commit on a long-lived feature branch
      # keeps its own immutable URL -- that is the "artifacts for posterity"
      # log the Notion implementation doc links to, one entry per milestone.
      #
      # Globbed over sim/out/ rather than a hardcoded file list: new scenarios
      # land in later increments of this very epic, and a list here would mean
      # every one of them needs a CI edit before its video appears.
      - name: Publish sha-stamped preview
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          short="${ARTIFACT_SHA:0:7}"
          mkdir -p preview
          for f in sim/out/*; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            case "$base" in
              *.*) cp "$f" "preview/${base%.*}-${short}.${base##*.}" ;;
              *)   cp "$f" "preview/${base}-${short}" ;;
            esac
          done
          ls -la preview/

          gh release view sim-preview >/dev/null 2>&1 || \
            gh release create sim-preview \
              --prerelease \
              --title "Sim previews (feature branches)" \
              --notes "Per-commit renders from open PRs. Sha-stamped and accumulating; mainline artifacts live in the sim-latest release instead."
          # --clobber so re-running a job for the same sha replaces rather than
          # errors; distinct shas never collide because the name carries one.
          gh release upload sim-preview --clobber preview/*

          {
            echo "### Preview artifacts — \`$short\` (\`$BRANCH\`)"
            echo
            for f in preview/*; do
              n="$(basename "$f")"
              echo "- [\`$n\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/sim-preview/$n)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Phase C (deferred): notify overboard-web so it redeploys with the new
      # clip. Needs a fine-grained PAT with contents:write on that repo, stored
      # as WEB_DISPATCH_TOKEN. Guarded so mainline is not broken by its absence.
      #
      # Mainline-only: the job itself now also runs on PRs, so without this
      # guard every PR commit would redeploy the public site with an
      # unreviewed clip.
      - name: Notify overboard-web
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          WEB_DISPATCH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
        run: |
          # Checked in the shell, not in an `if:` -- job/step-level `env` is not
          # visible to workflow-level `if` expressions, so `if: env.X != ''`
          # against a step env silently evaluates false and the step is skipped
          # forever, including after the secret is added.
          if [ -z "$WEB_DISPATCH_TOKEN" ]; then
            echo "WEB_DISPATCH_TOKEN unset - skipping web redeploy (Phase C not wired yet)"
            exit 0
          fi
          GH_TOKEN="$WEB_DISPATCH_TOKEN" gh api repos/MikePaNtZ/overboard-web/dispatches \
            -f event_type=sim-artifact \
            -F client_payload[commit]="${{ github.sha }}"
